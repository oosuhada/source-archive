  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#0b0b0b;color:#eee;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}.filters{position:sticky;top:0;z-index:20;display:flex;align-items:center;padding:14px 18px 12px;overflow:hidden;background:rgba(11,11,11,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07)}.filter-strip{min-width:0;flex:1;display:flex;align-items:center;gap:18px;overflow-x:auto;scrollbar-width:none}.filter-strip::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;padding:0 0 4px;border:0;border-bottom:1px solid transparent;background:none;color:rgba(255,255,255,.4);font:500 10px/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:color .2s ease,border-color .2s ease}.filter b{margin-left:6px;font-weight:500;color:rgba(255,255,255,.24)}.filter:hover,.filter:focus-visible{color:rgba(255,255,255,.78);outline:none}.filter.active{color:#fff;border-color:rgba(255,255,255,.72)}.filter.active b{color:rgba(255,255,255,.55)}.gallery{padding:10px 18px 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;background:#181818;color:inherit;text-decoration:none;border:0;isolation:isolate}.tile.thumbnail-loading{background:linear-gradient(110deg,#151515 18%,#292929 35%,#151515 52%);background-size:260% 100%;animation:thumbnail-shimmer 1.1s linear infinite}.tile.thumbnail-ready{background:#181818}.tile::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 44%,rgba(0,0,0,.14),rgba(0,0,0,.72));box-shadow:inset 0 0 72px rgba(0,0,0,.72);opacity:0;transition:opacity .3s ease}.tile img,.tile-preview{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;transition:opacity .16s ease,filter .32s ease}.tile.thumbnail-loading img{opacity:0}.tile.thumbnail-ready img{opacity:1}.tile-preview{position:absolute;inset:0;z-index:0;opacity:0;transition:opacity .2s ease,filter .32s ease;pointer-events:none}.tile.previewing .tile-preview{opacity:1}.tile:hover img,.tile:hover .tile-preview,.tile:focus-visible img,.tile:focus-visible .tile-preview{filter:brightness(.5) contrast(1.06) saturate(.84)}.tile:hover::after,.tile:focus-visible::after{opacity:1}.n{position:absolute;z-index:3;left:12px;top:10px;font:11px/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;letter-spacing:.08em;text-shadow:0 1px 8px #000}.tile-title{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;opacity:0;font:500 clamp(12px,1.15vw,16px)/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 2px 18px rgba(0,0,0,.82);transition:opacity .24s ease;pointer-events:none;white-space:nowrap}.tile:hover .tile-title,.tile:focus-visible .tile-title{opacity:1}.detail{display:none}.detail.active{display:block;min-height:720vh}.film{position:fixed;inset:0;background:#000;overflow:hidden}.film video{width:100%;height:100%;object-fit:cover;display:block}.back{position:fixed;z-index:6;left:18px;top:18px;border:0;background:rgba(0,0,0,.45);color:#fff;padding:10px 12px;font:11px/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;text-decoration:none;backdrop-filter:blur(8px)}.counter{position:fixed;z-index:6;right:18px;top:18px;font:11px/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;text-shadow:0 1px 8px #000}.progress{position:fixed;z-index:3;left:18px;right:18px;bottom:18px;height:1px;background:rgba(255,255,255,.25)}.progress i{display:block;height:100%;width:0;background:#fff}.error{display:none;position:fixed;inset:0;z-index:5;place-items:center;background:#111;font:12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.error.show{display:grid}@keyframes thumbnail-shimmer{to{background-position:-260% 0}}@media(max-width:1020px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.filters{padding:12px 10px 10px}.filter-strip{gap:14px}.gallery{grid-template-columns:1fr;padding:8px 10px 10px}.tile-title{font-size:13px}}
  </style>
  <style>
    .search-toggle,.search-close{flex:0 0 auto;width:34px;height:28px;display:grid;place-items:center;border:0;background:#0b0b0b;color:rgba(255,255,255,.62);cursor:pointer;padding:0}.search-toggle{margin-left:12px;position:relative;z-index:2;box-shadow:-14px 0 18px #0b0b0b}.search-toggle:hover,.search-toggle:focus-visible,.search-close:hover,.search-close:focus-visible{color:#fff;outline:none}.search-toggle svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5}.search-shell{display:flex;align-items:center;width:100%;gap:10px}.search-mark{flex:0 0 auto;width:15px;height:15px;fill:none;stroke:rgba(255,255,255,.48);stroke-width:1.5}.archive-search{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;font:500 11px/1.2 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;letter-spacing:.08em}.archive-search::placeholder{color:rgba(255,255,255,.28)}.search-empty{grid-column:1/-1;min-height:35vh;display:grid;place-items:center;color:rgba(255,255,255,.34);font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
    .gallery-sentinel{grid-column:1/-1;height:1px}.tile.thumbnail-error{background:linear-gradient(135deg,#151515,#202020)}.tile.thumbnail-error::before{content:"THUMBNAIL UNAVAILABLE";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.28);font:9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}.tile.thumbnail-error img{visibility:hidden}.performance-dashboard{position:fixed;z-index:99;right:12px;bottom:12px;white-space:pre;padding:10px 12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.82);color:#a8ffbd;font:10px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;pointer-events:none;backdrop-filter:blur(10px)}
  </style>

<body>
  <nav id="filters" class="filters" aria-label="Archive filters"></nav>
  <main id="gallery" class="gallery"></main>
  <section id="detail" class="detail">
    <div class="film"><video id="video" muted playsinline preload="auto"></video></div>
    <div class="archive-intro" aria-hidden="true">
      <div id="archiveTitle" class="archive-title"></div>
      <div id="archiveReflection" class="archive-title-reflection"></div>
      <i class="motif motif-a"></i>
      <i class="motif motif-b"></i>
      <i class="motif motif-c"></i>
    </div>
    <div class="archive-outro" aria-hidden="true">
      <div id="archiveOutroTitle" class="archive-outro-title"></div>
      <div class="archive-outro-label">OOSUHADA ARCHIVE</div>
      <div class="archive-outro-url">oosu.dev</div>
    </div>
    <a class="back" href="./">←</a>
    <div id="counter" class="counter"></div>
    <div class="progress"><i id="bar"></i></div>
  </section>
  <div id="error" class="error">MEDIA ERROR</div>
  <script src="data/build-meta.js"></script>
  <script src="performance-dashboard.js"></script>
  <script src="data/source-library-data.js"></script>
  <script src="data/source-library-youtube-data.js"></script>
  <script src="data/preview-manifest.js"></script>
  <script>
    const thumbRoot='assets/thumbs-medium/';
    const videoRoots={
      r2:'https://source-media.oosu.dev/media/',
      b2:'https://source-media-b2.oosu.dev/media/'
    };
    const previewRoots={
      r2:'https://source-media.oosu.dev/previews/',
      b2:'https://source-media-b2.oosu.dev/previews/'
    };
    const videoUrl=item=>`${videoRoots[item.media]||videoRoots.r2}${item.clip}`;
    const previewUrl=item=>item.preview?`${previewRoots[item.previewMedia||item.media]||previewRoots.r2}${item.preview}`:'';
    const items=window.SOURCE_LIBRARY||[];
    // Do not couple hover playback to asynchronously fetched metadata: if one
    // metadata request fails, valid preview mappings must still be available.
    const previewById=new Map((window.SOURCE_ARCHIVE_PREVIEWS||[]).map(entry=>[entry.id,entry]));
    items.forEach(item=>{const entry=previewById.get(item.id);if(entry){item.preview=entry.file;item.previewMedia=entry.media}});
    const params=new URLSearchParams(location.search);
    const selected=params.get('clip');
    const gallery=document.querySelector('#gallery');
    const filters=document.querySelector('#filters');
    const detail=document.querySelector('#detail');
    const video=document.querySelector('#video');
    const bar=document.querySelector('#bar');
    const counter=document.querySelector('#counter');
    const error=document.querySelector('#error');
    const archiveTitle=document.querySelector('#archiveTitle');
    const archiveReflection=document.querySelector('#archiveReflection');
    const archiveOutroTitle=document.querySelector('#archiveOutroTitle');
    const filterDefs=['ALL','Apple','Food','Nature','Experimental','Abstract','Object','Template','Cosmos','Water','Business','People','Travel','Sport'];
    const cosmosIds=new Set(['12','13','25','111','112','138','140']);
    const categoryAliases={
      'Food / Drink':'Food','Nature / Land':'Nature','Experimental / Material / Object':'Experimental',
      'Sky / Space / Weather':'Nature','Water':'Water','Work / Tech':'Business','People / Culture':'People',
      'Travel / City / Architecture':'Travel','Sport / Physical':'Sport'
    };
    const categoryFor=item=>cosmosIds.has(item.id)?'Cosmos':(categoryAliases[item.category]||item.category||'Experimental');
    let activeFilter=params.get('filter')||'ALL';
    let searchMode=params.has('q');
    let searchQuery=params.get('q')||'';
    let orderedItems=[];
    let searchResultIds=null,searchRequestId=0,searchReady=false,resultKey='';
    const thumbnailState=new Map(),thumbnailQueue=[];
    let thumbnailActive=0,thumbnailObserver=null,thumbnailPauseUntil=0,thumbnailResumeTimer=0;
    const thumbnailConcurrency=matchMedia('(max-width:700px)').matches?3:4;
    const metric=(group,values)=>dispatchEvent(new CustomEvent('source-archive:metric',{detail:{group,values}}));
    function seededShuffle(list,seed=20260829){
      const out=[...list];let s=seed>>>0;
      const random=()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296};
      for(let i=out.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
      return out;
    }
    function assignPublicIds(){
      const stable=[...items].sort((a,b)=>Number(a.id)-Number(b.id));
      stable.filter(item=>Number(item.id)<15).forEach(item=>item.publicId=item.id);
      // Preserve the established 15–238 public numbering even as new archive
      // records are appended. New records receive their own appended IDs.
      const legacyPool=stable.filter(item=>Number(item.id)>=15&&Number(item.id)<=238);
      const shuffledNumbers=seededShuffle(legacyPool.map((_,index)=>String(index+15).padStart(2,'0')),20260829);
      legacyPool.forEach((item,index)=>item.publicId=shuffledNumbers[index]);
      const peopleByCurrentNumber=legacyPool
        .filter(item=>categoryFor(item)==='People')
        .sort((a,b)=>Number(a.publicId)-Number(b.publicId));
      const peopleNumbers=peopleByCurrentNumber.map(item=>item.publicId);
      peopleByCurrentNumber.forEach((item,index)=>item.publicId=peopleNumbers[peopleNumbers.length-1-index]);
      stable.filter(item=>Number(item.id)>238).forEach(item=>item.publicId=String(item.id));
      const publicIdSwaps=new Map([
        ['271','37'],['186','271'],
        ['272','91'],['24','272'],
        ['273','158'],['17','273'],
        ['274','229'],['107','274']
      ]);
      stable.forEach(item=>{if(publicIdSwaps.has(item.id))item.publicId=publicIdSwaps.get(item.id)});
      // The gallery is a numbered archive: its physical order always follows
      // public IDs. Title-family ordering is applied only to search results.
      orderedItems=[...items].sort((a,b)=>Number(a.publicId)-Number(b.publicId));
    }
    function titleFamily(item){
      const match=item.title.trim().match(/^(.*?)(?:\s+(\d+))?$/);
      return {base:match[1].toLowerCase(),variant:match[2]?Number(match[2]):1};
    }
    function orderTitleVariants(list){
      const bases=new Set(list.map(item=>titleFamily(item)).filter(parsed=>parsed.variant===1).map(parsed=>parsed.base));
      const families=new Map();
      for(const item of list){const parsed=titleFamily(item);if(parsed.variant>1&&bases.has(parsed.base)){if(!families.has(parsed.base))families.set(parsed.base,[]);families.get(parsed.base).push({item,variant:parsed.variant})}}
      if(!families.size)return list;
      const variants=new Set([...families.values()].flatMap(group=>group.map(entry=>entry.item.id)));
      const output=[];
      for(const item of list){
        if(variants.has(item.id))continue;
        output.push(item);const parsed=titleFamily(item);const group=families.get(parsed.base);
        if(group)output.push(...group.sort((a,b)=>a.variant-b.variant||Number(a.item.publicId)-Number(b.item.publicId)).map(entry=>entry.item));
      }
      return output;
    }
    function searchScore(item,query){
      const normalized=query.trim().toLowerCase();if(!normalized)return 1;
      const tokens=normalized.split(/\s+/).filter(Boolean);
      const title=item.title.toLowerCase();
      const category=categoryFor(item).toLowerCase();
      const keywords=(item.keywords||[]).flatMap(keyword=>String(keyword).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean));
      let total=0;
      for(const token of tokens){
        let score=0;
        if(String(Number(item.publicId))===token||item.publicId===token)score=Math.max(score,130);
        if(title===token)score=Math.max(score,120);
        else if(title.startsWith(token))score=Math.max(score,90);
        else if(title.includes(token))score=Math.max(score,70);
        if(category===token)score=Math.max(score,55);else if(category.includes(token))score=Math.max(score,34);
        for(const keyword of keywords){if(keyword===token)score=Math.max(score,48);else if(keyword.startsWith(token))score=Math.max(score,34);else if(keyword.includes(token))score=Math.max(score,18)}
        if(!score)return 0;total+=score;
      }
      return total;
    }
    const searchIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path></svg>';
    function renderTopbar(){
      if(searchMode){
        filters.innerHTML=`<div class="search-shell">${searchIcon.replace('<svg','<svg class="search-mark"')}<input id="archiveSearch" class="archive-search" type="search" autocomplete="off" spellcheck="false" placeholder="SEARCH ARCHIVE" value="${searchQuery.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><button class="search-close" type="button" aria-label="Close search">×</button></div>`;
        const input=filters.querySelector('#archiveSearch');
        input.addEventListener('input',()=>{searchQuery=input.value;const url=new URL(location.href);url.searchParams.set('q',searchQuery);url.searchParams.delete('filter');history.replaceState(null,'',url);requestSearch()});
        input.addEventListener('keydown',event=>{if(event.key==='Escape')closeSearch()});
        filters.querySelector('.search-close').addEventListener('click',closeSearch);
        requestAnimationFrame(()=>input.focus({preventScroll:true}));
        return;
      }
      filters.innerHTML=`<div class="filter-strip">${filterDefs.map(key=>{
        const count=key==='ALL'?items.length:items.filter(x=>categoryFor(x)===key).length;
        const label=key==='ALL'?'All':key;
        return `<button class="filter${activeFilter===key?' active':''}" type="button" data-filter="${key}">${label}<b>${count}</b></button>`;
      }).join('')}</div><button class="search-toggle" type="button" aria-label="Search archive">${searchIcon}</button>`;
      filters.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{
        activeFilter=button.dataset.filter;
        const url=new URL(location.href);if(activeFilter==='ALL')url.searchParams.delete('filter');else url.searchParams.set('filter',activeFilter);history.replaceState(null,'',url);
        renderTopbar();renderGallery();scrollTo(0,0);
      }));
      filters.querySelector('.search-toggle').addEventListener('click',()=>{searchMode=true;searchQuery='';searchResultIds=[];const url=new URL(location.href);url.searchParams.delete('filter');url.searchParams.set('q','');history.replaceState(null,'',url);renderTopbar();renderGallery()});
    }
    function closeSearch(){
      searchMode=false;searchQuery='';const url=new URL(location.href);url.searchParams.delete('q');if(activeFilter!=='ALL')url.searchParams.set('filter',activeFilter);history.replaceState(null,'',url);renderTopbar();renderGallery();
    }
    const searchWorker='Worker' in window?new Worker(`search-worker.js?v=${encodeURIComponent(window.SOURCE_ARCHIVE_BUILD?.version||'dev')}`):null;
    function requestSearch(){
      if(!searchQuery.trim()){searchResultIds=[];renderGallery();return}
      searchResultIds=null;renderGallery();
      if(searchWorker&&searchReady){searchWorker.postMessage({type:'search',query:searchQuery,requestId:++searchRequestId});return}
      if(!searchWorker){const started=performance.now();const ranked=orderedItems.map(item=>({item,score:searchScore(item,searchQuery)})).filter(result=>result.score>0).sort((a,b)=>b.score-a.score||Number(a.item.publicId)-Number(b.item.publicId)).map(result=>result.item);searchResultIds=orderTitleVariants(ranked).map(item=>item.id);metric('search',{last:performance.now()-started,results:searchResultIds.length});renderGallery()}
    }
    if(searchWorker){
      searchWorker.addEventListener('message',({data})=>{
        if(data.type==='ready'){searchReady=true;if(searchMode&&searchQuery.trim())requestSearch();return}
        if(data.type==='results'&&data.requestId===searchRequestId){searchResultIds=data.ids;metric('search',{last:data.duration,results:data.ids.length});renderGallery()}
        if(data.type==='error'){console.warn('Search worker:',data.message)}
      });
    }
    function bindTilePreviews(root){
      let active=null;
      const stop=tile=>{if(!tile)return;const preview=tile.querySelector('.tile-preview');if(!preview)return;delete tile.dataset.previewWanted;preview.pause();tile.classList.remove('previewing');try{preview.currentTime=0}catch{}if(active===tile)active=null};
      root.querySelectorAll('.tile[data-preview]:not([data-bound])').forEach(tile=>{
        tile.dataset.bound='1';const preview=tile.querySelector('.tile-preview');if(!preview)return;
        const wanted=()=>active===tile&&tile.dataset.previewWanted==='1';
        const reveal=()=>{if(wanted())tile.classList.add('previewing')};
        const play=()=>{if(wanted())preview.play().catch(()=>{})};
        // Reveal on the first decoded frame rather than only on `playing`.
        // Some browsers resolve muted autoplay slightly later than canplay.
        preview.addEventListener('loadeddata',reveal);
        preview.addEventListener('canplay',()=>{reveal();play()});
        preview.addEventListener('playing',()=>{reveal();metric('media',{firstFrame:performance.now()-Number(tile.dataset.hoverAt||performance.now())})});
        const start=()=>{if(!tile.dataset.preview||active===tile)return;if(active&&active!==tile)stop(active);pauseThumbnailWarmup();active=tile;tile.dataset.previewWanted='1';tile.dataset.hoverAt=performance.now();preview.muted=true;preview.defaultMuted=true;preview.autoplay=true;preview.playsInline=true;preview.preload='auto';if(!preview.src){preview.src=tile.dataset.preview;preview.load()}else{try{preview.currentTime=0}catch{}};play()};
        tile.addEventListener('pointerenter',start);
        tile.addEventListener('mouseenter',start);
        tile.addEventListener('mouseleave',()=>stop(tile));
        tile.addEventListener('pointerleave',()=>stop(tile));
      });
    }
    function bindImageRecovery(root){
      root.querySelectorAll('.tile img:not([data-recovery-bound])').forEach(img=>{
        img.dataset.recoveryBound='1';img.dataset.retryCount='0';
        const markLoaded=()=>{
          const tile=img.closest('.tile');if(!tile)return;
          tile.classList.remove('thumbnail-error','thumbnail-loading');
          tile.classList.add(img.getAttribute('src')===img.dataset.low?'thumbnail-lowready':'thumbnail-ready');
        };
        img.addEventListener('load',markLoaded);if(img.complete&&img.naturalWidth)markLoaded();
        img.addEventListener('error',()=>{
          const attempt=Number(img.dataset.retryCount||0)+1;img.dataset.retryCount=String(attempt);
          if(attempt<=2){setTimeout(()=>{const url=new URL(img.src,location.href);url.searchParams.set('retry',`${window.SOURCE_ARCHIVE_BUILD?.version||'dev'}-${attempt}`);img.src=url.href},attempt*350);return}
          img.closest('.tile')?.classList.add('thumbnail-error');metric('resources',{thumbnailErrors:(window.__SOURCE_ARCHIVE_METRICS__?.resources?.thumbnailErrors||0)+1});
        });
      });
    }
    function updateThumbnail(url,state){
      document.querySelectorAll('img[data-thumb]').forEach(img=>{
        if(img.dataset.thumb!==url)return;
        const tile=img.closest('.tile');
        if(state==='ready'){
          if(img.src!==url)img.src=url;
          tile?.classList.remove('thumbnail-loading');tile?.classList.add('thumbnail-ready');
        }
        if(state==='error')tile?.classList.remove('thumbnail-loading');
      });
    }
    function pumpThumbnailQueue(){
      if(Date.now()<thumbnailPauseUntil){clearTimeout(thumbnailResumeTimer);thumbnailResumeTimer=setTimeout(pumpThumbnailQueue,thumbnailPauseUntil-Date.now()+20);return}
      while(thumbnailActive<thumbnailConcurrency&&thumbnailQueue.length){
        const entry=thumbnailQueue.shift();
        if(thumbnailState.get(entry.url)!=='queued')continue;
        thumbnailActive+=1;thumbnailState.set(entry.url,'loading');
        const image=new Image();image.decoding='async';
        image.onload=()=>{thumbnailState.set(entry.url,'ready');thumbnailActive-=1;updateThumbnail(entry.url,'ready');pumpThumbnailQueue()};
        image.onerror=()=>{thumbnailState.set(entry.url,'error');thumbnailActive-=1;updateThumbnail(entry.url,'error');pumpThumbnailQueue()};
        image.src=entry.url;
      }
    }
    function queueThumbnail(url,priority=0){
      const state=thumbnailState.get(url);
      if(state==='ready'){updateThumbnail(url,'ready');return}
      if(state==='queued'||state==='loading')return;
      thumbnailState.set(url,'queued');
      if(priority>0)thumbnailQueue.unshift({url});else thumbnailQueue.push({url});
      pumpThumbnailQueue();
    }
    function pauseThumbnailWarmup(){
      // Video playback is the primary hover interaction. Do not begin another
      // medium-resolution image transfer while its first frame is arriving.
      thumbnailPauseUntil=Date.now()+900;
    }
    function prepareThumbnails(root){
      thumbnailObserver?.disconnect();
      const images=[...root.querySelectorAll('img[data-thumb]')];
      // All cards receive a tiny 240px image immediately. 480px images only
      // warm near the viewport, so hover video never competes with 960px art.
      images.slice(0,24).forEach(img=>queueThumbnail(img.dataset.thumb,2));
      thumbnailObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{
        if(entry.isIntersecting)queueThumbnail(entry.target.dataset.thumb,3);
      }),{rootMargin:'1500px 0px'});
      images.forEach(img=>thumbnailObserver.observe(img));
      setTimeout(()=>images.forEach(img=>queueThumbnail(img.dataset.thumb)),3000);
    }
    function renderGallery(){
      let visible;
      if(searchMode&&searchQuery.trim()){
        if(searchResultIds===null){gallery.innerHTML='<div class="search-empty">SEARCHING</div>';return}
        const byId=new Map(orderedItems.map(item=>[item.id,item]));visible=searchResultIds.map(id=>byId.get(id)).filter(Boolean);
      }else visible=activeFilter==='ALL'||searchMode?orderedItems:orderedItems.filter(item=>categoryFor(item)===activeFilter);
      const contextQuery=searchMode?`&q=${encodeURIComponent(searchQuery)}`:activeFilter==='ALL'?'':`&filter=${encodeURIComponent(activeFilter)}`;
      const key=`${activeFilter}|${searchQuery}|${visible.map(item=>item.id).join(',')}`;resultKey=key;
      gallery.innerHTML=visible.length?visible.map(item=>{const preview=previewUrl(item),thumb=`${thumbRoot}${item.thumb}`,lowThumb=`assets/thumbs-low/${item.thumb}`;return `<a class="tile thumbnail-loading" href="?clip=${item.publicId}${contextQuery}" aria-label="${item.publicId} ${item.title}"${preview?` data-preview="${preview}"`:''}><img src="${lowThumb}" data-low="${lowThumb}" data-thumb="${thumb}" alt="" decoding="async" fetchpriority="low" width="240" height="135">${preview?'<video class="tile-preview" muted autoplay playsinline loop preload="none"></video>':''}<span class="n">${item.publicId}</span><span class="tile-title">${item.title}</span></a>`}).join(''):'<div class="search-empty">NO MATCHES</div>';
      bindImageRecovery(gallery);bindTilePreviews(gallery);prepareThumbnails(gallery);
    }
    async function prepareGallery(){
      try{
        const [response,overridesResponse]=await Promise.all([
          fetch('data/youtube-archive-manifest.json',{cache:'no-store'}),
          fetch('data/youtube-archive-manifest-overrides.json',{cache:'no-store'})
        ]);
        if(response.ok){
          const manifest=await response.json();
          const overrides=overridesResponse.ok?await overridesResponse.json():[];
          const overrideById=new Map(overrides.map(x=>[x.id,x]));
          const merged=manifest.map(x=>({...x,...(overrideById.get(x.id)||{})}));
          overrides.forEach(x=>{if(!manifest.some(base=>base.id===x.id))merged.push(x)});
          const metaById=new Map(merged.map(x=>[x.id,x]));
          items.forEach(item=>{
            const meta=metaById.get(item.id);
            if(!meta)return;
            if(meta.category)item.category=meta.category;
            if(Array.isArray(meta.keywords))item.keywords=meta.keywords;
          });
        }
      }catch{}
      if(!filterDefs.includes(activeFilter))activeFilter='ALL';
      renderTopbar();renderGallery();
    }
    assignPublicIds();
    searchWorker?.postMessage({type:'init',version:window.SOURCE_ARCHIVE_BUILD?.version,publicIds:Object.fromEntries(items.map(item=>[item.id,item.publicId]))});
    if(!selected){prepareGallery()}else{
      const item=items.find(x=>x.publicId===selected);
      if(!item){location.replace('./')}else{
        gallery.style.display='none';filters.style.display='none';
        const returnFilter=params.get('filter');
        const returnQuery=params.get('q');
        document.querySelector('.back').href=returnQuery!==null?`./?q=${encodeURIComponent(returnQuery)}`:returnFilter?`./?filter=${encodeURIComponent(returnFilter)}`:'./';
        const itemCategory=categoryFor(item);
        detail.classList.add('active',`theme-${item.theme || item.id}`,`clip-${item.id}`,`category-${itemCategory.toLowerCase().replace(/[^a-z0-9]+/g,'-')}`);
        counter.textContent=`${item.publicId} / ${String(items.length).padStart(2,'0')}`;
        archiveTitle.textContent=item.title;
        archiveReflection.textContent=item.title;
        archiveOutroTitle.textContent=item.title;
        video.muted=true;
        video.playsInline=true;
        video.setAttribute('playsinline','');
        video.setAttribute('webkit-playsinline','');
        video.preload='auto';
        video.src=videoUrl(item);
        let duration=1,target=0,ready=false,primed=false,seekTimer=0,seekRaf=0,lastSeekAt=0,pendingSeek=false,seekStartedAt=0,mediaStartedAt=performance.now();
        const clamp=v=>Math.max(0,Math.min(1,v));
        const seekInterval=95;
        const performSeek=()=>{
          seekRaf=0;
          if(!ready)return;
          if(video.seeking){pendingSeek=true;return}
          if(Math.abs(video.currentTime-target)<.045)return;
          const wait=seekInterval-(performance.now()-lastSeekAt);
          if(wait>0){clearTimeout(seekTimer);seekTimer=setTimeout(scheduleSeek,wait);return}
          lastSeekAt=performance.now();pendingSeek=false;
          try{
            seekStartedAt=performance.now();
            if(typeof video.fastSeek==='function')video.fastSeek(target);
            else video.currentTime=target;
          }catch{pendingSeek=true;clearTimeout(seekTimer);seekTimer=setTimeout(scheduleSeek,160)}
        };
        const scheduleSeek=()=>{if(!seekRaf)seekRaf=requestAnimationFrame(performSeek)};
        const primeVideo=()=>{
          if(primed)return;primed=true;
          const attempt=video.play();
          if(attempt&&typeof attempt.then==='function')attempt.then(()=>{video.pause();scheduleSeek()}).catch(()=>{});
          else{video.pause();scheduleSeek()}
        };
        function update(){
          const max=Math.max(1,document.documentElement.scrollHeight-innerHeight),p=clamp(scrollY/max);
          const isApple=itemCategory==='Apple';
          const intro=clamp(p/.11),introOut=clamp((p-.075)/.075);
          const filmP=isApple?clamp((p-.13)/.77):clamp(p/.9);
          const appleFilm=isApple?clamp((p-.13)/.045):1;
          const outro=clamp((p-.925)/.055);
          const outroText=clamp((p-.955)/.035);
          target=filmP*Math.max(.01,duration-.04);
          detail.style.setProperty('--p',p.toFixed(4));
          detail.style.setProperty('--intro',intro.toFixed(4));
          detail.style.setProperty('--intro-out',introOut.toFixed(4));
          detail.style.setProperty('--apple-film',appleFilm.toFixed(4));
          detail.style.setProperty('--outro',outro.toFixed(4));
          detail.style.setProperty('--outro-text',outroText.toFixed(4));
          bar.style.width=`${(p*100).toFixed(2)}%`;
          primeVideo();scheduleSeek();
        }
        video.addEventListener('loadedmetadata',()=>{
          duration=video.duration||1;
          const scrollHeight=item.scrollHeightVh ?? Math.round(Math.max(720,Math.min(3600,duration*30)));
          detail.style.minHeight=`${scrollHeight}vh`;
          video.pause();ready=true;scrollTo(0,0);update();
        });
        video.addEventListener('seeked',()=>{if(seekStartedAt)metric('media',{seek:performance.now()-seekStartedAt});if(pendingSeek||Math.abs(video.currentTime-target)>.08)scheduleSeek()});
        video.addEventListener('canplay',()=>{metric('media',{firstFrame:performance.now()-mediaStartedAt});scheduleSeek()},{once:true});
        video.addEventListener('error',()=>error.classList.add('show'));
        addEventListener('scroll',update,{passive:true});addEventListener('resize',update);
        ['touchstart','pointerdown','wheel'].forEach(type=>addEventListener(type,primeVideo,{once:true,passive:true}));
        video.load();
      }
    }
    if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register(`sw.js?v=${encodeURIComponent(window.SOURCE_ARCHIVE_BUILD?.version||'dev')}`).catch(()=>{});
  </script>
